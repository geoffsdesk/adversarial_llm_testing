[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-llm-testing"
version = "0.1.0"
description = "A Python library for defensive security research and red teaming to test LLM vulnerabilities"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Security Research"},
]
keywords = [
    "llm",
    "security",
    "prompt-injection",
    "adversarial-testing",
    "red-teaming",
    "ai-safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core dependencies - minimal for now
    # No external dependencies required for basic functionality
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
local = [
    "llama-cpp-python>=0.2.0",
    "vllm>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/geoffsdesk/adversarial_llm_testing"
Documentation = "https://github.com/geoffsdesk/adversarial_llm_testing"
Repository = "https://github.com/geoffsdesk/adversarial_llm_testing"
Issues = "https://github.com/geoffsdesk/adversarial_llm_testing/issues"

[tool.setuptools]
packages = {find = {}}

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=adversarial_llm_testing --cov-report=html --cov-report=term --cov-report=xml"
asyncio_mode = "auto"

[project.scripts]
adversarial-llm-test = "adversarial_llm_testing.cli:main"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

